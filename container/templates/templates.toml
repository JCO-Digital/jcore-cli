[jcore3]
branch = "irishcoffee"
branches = ["gintonic", "hurricane", "irishcoffee"]
ydinVersions = { gintonic = "^3", hurricane = "^4", irishcoffee = "^5" }
php = "8.4"
themeUrl = "https://github.com/JCO-Digital/jcore-ilme/archive/refs/heads/{{branch}}.zip"
lohko = true
plugins = [
  "https://github.com/JCO-Digital/jcore-dynamic-archive/releases/latest/download/jcore-dynamic-archive.zip",
  "https://github.com/JCO-Digital/jcore-turva/releases/latest/download/jcore-turva.zip",
]

[jcore2]
# New projects use the Timber 2 parent theme branches. Existing projects keep
# whatever branch they track (the bare "grasshopper" etc. are Timber 1); the
# composer template's timber/timber constraint follows the project's branch.
branch = "timber2/grasshopper"
branches = ["timber2/elduelo", "timber2/fluffycritter", "timber2/grasshopper"]
themeUrl = "https://files.jco.fi/jcore2-child-{{branch}}.zip"
php = "8.2"
child = true

[[jcore2.submodules]]
path = "wp-content/themes/jcore2"
repo = "git@github.com:JCO-Digital/jcore2.git"
useBranch = true

[blank]
branch = "main"
branches = []

[jcore1]
branch = "master"
branches = ["master"]
child = true

[[jcore1.submodules]]
path = "wp-content/themes/jcore"
repo = "git@github.com:JCO-Digital/jcore1.git"
useBranch = true
