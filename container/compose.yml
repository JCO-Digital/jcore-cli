# Generated by jcore on every start - do not edit, changes are overwritten.
# Put project-specific changes in compose.override.yml, which jcore merges
# on top of this file.

networks:
  jcore:
    driver: bridge

services:
  # Container to create certs and exit.
  tlscerts:
    image: "jcodigi/tlscerts:latest"
    environment:
      CERT_DIR: "/home/jcore/ca"
      SSL_DIR: "/home/jcore/ssl"
      LOCAL_DOMAIN: ${LOCAL_DOMAIN}
      DOMAINS: ${DOMAINS}
    volumes:
      - .:/project
      - ./.jcore/ssl:/home/jcore/ssl
      - ~/.config/jcore/ssl:/home/jcore/ca

  # MariaDB container
  db:
    image: "mariadb:11.2"
    # Local dev DB: trade crash durability for much faster bulk imports.
    command:
      - --innodb-buffer-pool-size=1G
      - --innodb-flush-log-at-trx-commit=2
      - --innodb-log-file-size=512M
      - --max-allowed-packet=256M
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: ${WP_DB_NAME}
      MYSQL_USER: ${WP_DB_USER}
      MYSQL_PASSWORD: ${WP_DB_PASSWORD}
    volumes:
      - db:/var/lib/mysql
    networks:
      - default

  # Adminer, served by the JCore proxy at http://adminer.${LOCAL_DOMAIN}
  adminer:
    depends_on:
      db:
        condition: service_started
    image: adminer:latest
    networks:
      - default

  # PHP-fpm container with WordPress stuff.
  wordpress:
    depends_on:
      db:
        condition: service_started
      tlscerts:
        condition: service_completed_successfully
      redis:
        condition: service_started
    image: ${WP_IMAGE}
    user: "1000"
    environment:
      - CERT_DIR=/home/jcore/ca
      - SSH_AUTH_SOCK=/run/user/1000/ssh-agent.socket
    env_file: .env
    volumes:
      - .:/project
      - ./.jcore/wordpress:/var/www/html
      - ./.jcore/php.ini:/usr/local/etc/php/php.ini
      - ./wp-content:/var/www/html/wp-content
      - ./vendor:/var/www/html/vendor
      - ~/.config/jcore/ssh:/home/jcore/.ssh
      - ~/.config/jcore/ssl:/home/jcore/ca
      - ${SSH_AUTH_SOCK:-/dev/null}:/run/user/1000/ssh-agent.socket:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - default
      - jcore
    working_dir: "/var/www/html"

  # Redis for the persistent object cache, matching production on
  # SpinupWP (Redis 8, allkeys-lru). Nothing is persisted to disk, so a
  # restart starts with an empty cache.
  redis:
    image: "redis:8-alpine"
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]

  # Mail catcher (Mailpit), served by the JCore proxy at
  # http://mail.${LOCAL_DOMAIN}. The service keeps its old "mailhog" name,
  # which the WordPress image uses as its SMTP host.
  mailhog:
    image: "axllent/mailpit:v1"

  # Nginx server configuration. Reached through the shared JCore proxy,
  # which owns host ports 80/443 (see .jcore/compose.proxy.yml).
  web:
    depends_on:
      db:
        condition: service_started
      # Restart nginx along with a recreated wordpress container: it only
      # resolves the PHP-FPM upstream's address when it starts.
      wordpress:
        condition: service_started
        restart: true
      tlscerts:
        condition: service_completed_successfully
    image: nginx:latest
    links:
      - db
      - wordpress
    volumes:
      - ./.jcore/wordpress:/var/www/html
      - ./.jcore/ssl:/etc/ssl
      - ./wp-content:/var/www/html/wp-content
      - ./.config/nginx:/etc/nginx/conf.d/
    networks:
      default:
      jcore:
        aliases:
          - ${LOCAL_DOMAIN}

volumes:
  db:
