# Shared JCore reverse proxy. Generated by jcore - do not edit, it is
# rewritten every time the proxy is started.
#
# Routes https://<domain> (and *.<domain>) to the matching project's own
# nginx by SNI, passing TLS straight through, so each project keeps serving
# its own certificate. Projects opt in through the labels jcore writes into
# their .jcore/compose.proxy.yml.
name: jcore-proxy

services:
  traefik:
    image: traefik:v3.7
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=jcore-proxy
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --api.dashboard=true
      - --log.level=WARN
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - jcore-proxy
    labels:
      traefik.enable: "true"
      # Dashboard at http://traefik.localhost
      traefik.http.routers.jcore-dashboard.rule: Host(`traefik.localhost`)
      traefik.http.routers.jcore-dashboard.entrypoints: web
      traefik.http.routers.jcore-dashboard.service: api@internal
      # Catch-all http -> https redirect. Lowest priority, so the per-project
      # adminer/mail routers on :80 win over it.
      traefik.http.routers.jcore-to-https.rule: HostRegexp(`.+`)
      traefik.http.routers.jcore-to-https.priority: "1"
      traefik.http.routers.jcore-to-https.entrypoints: web
      traefik.http.routers.jcore-to-https.middlewares: jcore-to-https
      traefik.http.routers.jcore-to-https.service: noop@internal
      traefik.http.middlewares.jcore-to-https.redirectscheme.scheme: https
      traefik.http.middlewares.jcore-to-https.redirectscheme.permanent: "false"

networks:
  jcore-proxy:
    external: true
